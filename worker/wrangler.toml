# Cloudflare Worker for /api/* (proxies + cron jobs).
# No secrets live here. Secrets are set with `npx wrangler secret put NAME`
# (e.g. NVD_API_KEY for v1.2) and never committed. Local overrides go in
# worker/.dev.vars, which is git-ignored.
name = "right-now-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# v1 needs no cron. v1.2 will add at most two (NVD + KEV), e.g.:
# [triggers]
# crons = ["*/20 * * * *", "17 */2 * * *"]
