<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Right Now — what's happening in the world, live</title>
    <meta
      name="description"
      content="A live window on what is happening in the world right now: every earthquake as USGS publishes it, drawn as a river of light. Real, open data only."
    />
    <meta name="theme-color" content="#07080C" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Right Now" />
    <meta
      property="og:description"
      content="Every earthquake on Earth, live, from open USGS data."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <div class="app">
      <header class="header">
        <a class="brand" href="/" aria-label="right now — home">
          <span class="live-dot" aria-hidden="true"></span>
          right now
        </a>
        <nav class="channels" aria-label="Channels" id="channels"></nav>
        <div class="header__status">
          <span class="chip chip--demo" id="demo-badge" hidden>DEMO DATA</span>
          <span id="freshness" class="freshness" role="status"></span>
          <span class="clock"><time id="clock">--:--:--</time> UTC</span>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>

      <footer class="ticker-bar">
        <div class="ticker" aria-hidden="true">
          <div class="ticker__track" id="ticker"></div>
        </div>
        <p class="visually-hidden" id="ticker-text"></p>
        <button class="sources-btn" type="button" id="sources-btn" aria-haspopup="dialog">
          SOURCES
        </button>
      </footer>
    </div>

    <dialog class="dialog" id="sources" aria-labelledby="sources-title"></dialog>
    <div class="visually-hidden" aria-live="polite" id="announcer"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
